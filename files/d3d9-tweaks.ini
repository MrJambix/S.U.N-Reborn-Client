; Render tweaks applied by the d3d9 wrapper.
;
; YOU DO NOT NORMALLY EDIT THIS FILE ANY MORE.
;
; Anisotropic Filtering and Anti-aliasing are now real entries in the game's own
; Options window, under Graphics. The client writes this file when you change them
; there, so editing it by hand only lasts until the next time the game saves its
; options. Use the Options window.
;
; Delete Client\d3d9.dll to remove the wrapper entirely.

[Render]

; Anisotropic filtering. Keeps ground, walls and long corridors sharp at glancing
; angles instead of blurring into mush -- the art is 2008-era and was authored for
; bilinear filtering.
;   0 = off, and the game's own texture settings are left completely alone
;   2/4/8/16 = max anisotropy
; Set by the "Anisotropic Filtering" option (which uses 16). Applies immediately.
Anisotropy=0

; Multisampling (MSAA). Smooths jagged edges.
;   0 = off, or 2 / 4 / 8 samples
; Set by the "Anti-aliasing" option (which uses 4). The sample count is fixed when
; the graphics device is created, so this one only takes effect the next time you
; start the game -- that is why the option says so.
;
; It degrades rather than breaking: the level is checked against your driver for
; both the backbuffer and the depth surface, walks down 4 -> 2, and if none is
; supported the game's original settings are restored.
MultiSample=0

; Vertical sync.  -1 = leave the game's setting alone, 0 = off, 1 = on.
; No Options entry -- this one is still hand-edited.
VSync=-1
