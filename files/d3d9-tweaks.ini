; Render tweaks applied by the d3d9 wrapper. Changed here, no rebuild needed.
; Delete Client\d3d9.dll to remove the wrapper entirely.

[Render]

; Anisotropic filtering, forced on every texture the engine binds.
;   0 or 1 = leave the engine's own filtering alone
;   2/4/8/16 = max anisotropy
; The art is 2008-era and authored for bilinear, so ground, walls and long
; corridors blur badly at oblique angles. This is the single most visible
; upgrade available without touching the client, and costs almost nothing on
; any GPU made in the last fifteen years.
Anisotropy=16

; Multisampling (MSAA).  0 = off, or 2 / 4 / 8 samples.
; OFF BY DEFAULT and deliberately: some backbuffer formats reject it and
; CreateDevice then fails, which means the game does not start. The wrapper
; retries with the engine's original parameters if that happens, so it should
; degrade rather than break -- but prove it at 2 before trying 4.
MultiSample=4

; Vertical sync.  -1 = leave the engine's setting alone, 0 = off, 1 = on.
VSync=-1
