[Patch]
; Where Launcher.exe looks for updates.
;
; It fetches  <BASE_URL>/manifest.txt  and then  <BASE_URL>/files/<path>
; for every entry that is not already installed.
;
; Set this to the RAW file root of the patch repo, with no trailing slash.
; For a public GitHub repo that is:
;
;     BASE_URL=https://raw.githubusercontent.com/MrJambix/S.U.N-Reborn-Client/main
;
; (use the raw.githubusercontent.com host, NOT github.com -- the normal repo
; URL serves an HTML page, and the launcher would reject the hash.)
;
; Leaving BASE_URL empty disables the update check entirely: the launcher goes
; straight to the game. That is also what happens if the host is unreachable, so
; a dead patch repo can never stop anyone playing.
;
; This file is plain config -- changing the URL needs no rebuild.
BASE_URL=https://raw.githubusercontent.com/MrJambix/S.U.N-Reborn-Client/main

; How often the launcher asks again, in seconds, while its window is open.
;
; It used to check exactly once, at startup. If a patch went up while someone
; had the launcher sitting open, they would press PLAY and start the game on
; the old files -- the launcher had no way to notice. It now re-checks on this
; interval and flips the button to UPDATE by itself.
;
; It only ever re-DETECTS. Downloading still waits for the button, so nothing
; is ever pulled behind the player's back, and a re-check is skipped entirely
; while an update is being applied.
;
; 0 restores the old check-once behaviour. Values below 30 are clamped to 30.
; The default of 300 (5 minutes) matches raw.githubusercontent's CDN cache --
; polling faster mostly re-reads bytes that have not changed yet.
CHECK_INTERVAL=300

[Region]
; Connection routes offered in the launcher's route picker, top right.
;
; A relay is a small box near the player that forwards the game ports back to
; the origin in New York. Their long haul then runs over a backbone instead of
; ISP-default routing, and -- the part that actually shows up in play -- a lost
; packet on their last mile is retransmitted over a ~20 ms hop instead of a
; ~200 ms one. Server\netlab\README.md is the whole picture, including the
; honest limit: nothing beats the ~180 ms US-Singapore fibre floor.
;
; ONLY THE LOGIN ADDRESS IS SET HERE. Everything after login is decided on the
; server from the address the player arrives FROM: AuthServer hands them the
; matching game agent and AgentServer the matching world/chat address
; (_JB_GEO_RELAY_ROUTING). So a route needs no client rebuild and no second
; entry anywhere -- but the relay MUST be listed in the server's three
; [SERVER_GEO_RELAY] tables, or that region logs in through the relay and then
; plays direct, which is slower than never having relayed at all.
;
; R<n>_KEY   stable id, saved in Patch\region.txt. Never reuse one for a
;            different place: a player pinned to it would silently move.
; R<n>_NAME  what the player reads in the list.
; R<n>_HOST  goes verbatim into System\LOGIN.INI LOGIN_SERVER_IP. Hostname or
;            IPv4; a hostname is better, since retargeting a relay is then a
;            DNS change with no patch.
; R<n>_PORT  probe port. The login port, 10100, unless a relay remaps it.
;
; The launcher measures each entry with three TCP connects and shows the best
; of them. "Automatic" follows the lowest number; a player who picks a row by
; hand overrides that until they pick another.
;
; Row 1 must be the direct route. If it is missing the launcher synthesises one
; from whatever LOGIN.INI currently says, so a mangled file still plays.
;
; With COUNT = 1 the picker has nothing to pick, so the chip becomes a plain
; readout of this player's own latency to the server -- which is the point of
; shipping it in that state: it is how we find out what each region actually
; sees before renting a relay for them.
COUNT      = 4

R1_KEY     = direct
R1_NAME    = Direct (New York)
R1_HOST    = play.gathertheguilty.com
R1_PORT    = 10100

; Relays. Uncomment a row and raise COUNT once the box is up AND its address is
; in the server's [SERVER_GEO_RELAY] tables -- in that order, never the reverse.
R2_KEY     = eu
R2_NAME    = Europe (Warsaw)
R2_HOST    = eu.gathertheguilty.com
R2_PORT    = 10100
;
R3_KEY     = asia
R3_NAME    = Asia (Singapore)
R3_HOST    = asia.gathertheguilty.com
R3_PORT    = 10100
;
R4_KEY     = sa
R4_NAME    = South America (Sao Paulo)
R4_HOST    = sa.gathertheguilty.com
R4_PORT    = 10100

[Language]
; Text languages offered in the launcher's language picker, left of the route
; chip.
;
; The game has always been able to do this. Every text table it loads goes
; through GlobalFunc::AddNationName, which appends a suffix chosen by ONE saved
; option -- LanguageType, in Client\GameData.dat under [PARAM]. That file is a
; plain INI the game reads and writes with Get/WritePrivateProfileString, so the
; launcher sets the language by writing that one key before the game starts.
; No client rebuild, no new file, nothing to ship but the text itself.
;
; The suffix table is fixed in Sungame.exe and cannot be changed from here:
;
;     L*_TYPE   suffix      engine name
;     0         _en.txt     kLanguageGlobal
;     1         .txt        kLanguageKorea
;     2         _cn.txt     kLanguageChina
;     3         _tw.txt     kLanguageTaiwan
;     4         _jp.txt     kLanguageJapan
;     5         _ger.txt    kLanguageGermany
;     6         _ru.txt     kLanguageRussia
;
; READ THIS BEFORE ADDING A ROW. The slot the engine calls "Korea" is the bare
; .txt name, and OUR bare .txt files are the English translation -- English is
; shipped in the Korean slot and has been since the archive was first made
; playable. The original Korean text lives in _kr.txt, which is a name of our
; own: the engine never asks for it, so type 1 does NOT give you Korean and
; there is no type that does. Korean needs a code change and a client ship.
; Server\LANGUAGE-PICKER.md has the whole inventory and what each one costs.
;
; L<n>_KEY   stable id. Only ever appears here and in Patch\launcher.log, so it
;            is safe to rename, unlike a region key.
; L<n>_NAME  what the player reads in the list, written in that language own
;            script (Русский, not "Russian"). The launcher reads this file as UTF-8
;            and draws with the wide GDI calls, so any script renders -- and the
;            same is true of the [Text.<key>] sections below.
; L<n>_TYPE  the LanguageType value written to GameData.dat. See the table.
; L<n>_TEST  a file whose presence proves this language is actually installed.
;            Rows that fail this test are dropped, so it is safe to list a
;            language before anyone has the files: it simply does not appear
;            until they do. Name the STRING TABLE, not a quest file -- the
;            string table is the UI, and a language that translates quests but
;            not the UI is a worse experience than not offering it at all.
;
; The chip hides itself entirely below two installed rows, because a picker
; offering one language is just a label. So on a stock install today there is
; no chip -- which is correct, and is what makes the rows below safe to leave
; commented until their text actually ships.
COUNT      = 2

L1_KEY     = en
L1_NAME    = English
L1_TYPE    = 1
L1_TEST    = StringTable.txt

; Russian. Every _ru table is built by Server\tools\lang\langtool.js from the
; English plus Server\lang\ru\tm.json; untranslated rows stay English, so the
; set is always complete. Needs the cp1251 renderer patch to draw on non-Russian
; Windows -- see Server\LANGUAGE-PICKER.md.
L2_KEY     = ru
L2_NAME    = Русский
L2_TYPE    = 6
L2_TEST    = StringTable_ru.txt

; German. Server\data has genuine _ger QuestText, messagetext, MissionText and
; HelpLoadingMessage from the Webzen era -- but no StringTable_ger, so the whole
; UI would stay English. Uncomment and raise COUNT once StringTable_ger.txt
; exists and ships. Note the umlauts: the client renders text as cp949, so
; Latin-1 high bytes are read as lead bytes and come out as garbage. That has
; to be solved before German is worth offering.
;L3_KEY    = de
;L3_NAME   = Deutsch
;L3_TYPE   = 5
;L3_TEST   = StringTable_ger.txt
;
; Simplified Chinese. Same story: Server\data has real _cn QuestText,
; MissionText, Filter, FilterName, HelpLoadingMessage and Message, and no
; StringTable_cn. Needs a cp936 font path as well.
;L4_KEY    = cn
;L4_NAME   = Chinese (Simplified)
;L4_TYPE   = 2
;L4_TEST   = StringTable_cn.txt

[Text.ru]
; The launcher's own text in Russian. Keys are the ones in
; Source\Client\Launcher\Lang.cpp; anything missing or blank falls back to the
; English built into the exe, so a partial translation is safe.
;
; THIS SECTION IS UTF-8. Save the file as UTF-8 WITHOUT a byte order mark -- a
; BOM would become part of the first section name and Windows would stop
; finding [Patch]. The launcher decodes these values as UTF-8 and draws them
; with the wide GDI calls, so they do not depend on the player's Windows
; code page (unlike the game's own text -- Server\LANGUAGE-PICKER.md).
;
; Strings that count things carry their plural forms separated by '|', in
; Russian order: one (1, 21), few (2-4, 22-24), many (0, 5-20). Keep every
; %d / %s in the same order as the English.

